<main class="workspace"><aside class="intro"><div class="overline">THE MORNING PRACTICE</div><h1>把健康，<br>过成一种生活方式。</h1><p>这是微信小程序的浏览器演示。<br>无需注册、无需扫码、无需安装。</p><div class="shortcuts"><button data-role="demo-member">① 体验成员打卡</button><button data-role="demo-visitor">② 从报名开始体验</button><button data-role="demo-admin">③ 查看管理员工作台</button></div><div class="hint">所有资料保存在当前浏览器，均为虚构演示。支付、退款不涉及真实资金。正式微信版的授权、设备接口和实际排版仍需单独验收。<br><br>本页可以断网打开。在“我的”可切换身份和重置演示。900元为累计返款上限，没有额外结营奖金。</div></aside>

<script>window.PREVIEW_SOURCES={"app.js":"const config = require('./config');\nconst { createLocalService, createCloudService } = require('./lib/service');\nApp({\n  onLaunch() {\n    try {\n      this.service = config.mode === 'demo'\n        ? createLocalService({ get: key => wx.getStorageSync(key), set: (key, value) => wx.setStorageSync(key, value) })\n        : createCloudService(wx, config);\n    } catch (error) {\n      this.service = { mode: 'unavailable', call: async () => { throw error; } };\n    }\n  }\n});\n","config.js":"module.exports = { mode: 'demo' };","lib/brand.js":"module.exports = {\n  name: '晨序', english: 'THE MORNING PRACTICE',\n  quote: '把清晨还给自己，把改变交给时间。',\n  author: '鸿彬', attribution: '原创寄语'\n};\n","lib/documents.js":"module.exports = {\n  health: { title: '健康风险告知', body: '开发演示草稿 · 尚待医疗与法律专业审定\\n\\n本营提供一般运动饮食教育、记录与社群支持，个体诊断、治疗与医疗运动处方应由有资质的专业人员承担。\\n\\n运动和饮食调整可能导致低血糖、跌倒、肌肉关节损伤及心血管事件，严重时可能危及生命，风险无法完全排除。\\n\\n请如实填写健康问卷。有心脑血管疾病、控制不佳的血压、运动异常症状、相关用药或伤病等情况时，应先接受专业评估。回答“不确定”会进入进一步评估流程。高血压不等于一律不能运动。\\n\\n运动中出现胸痛、晕厥或明显异常气促时，立即停止并及时就医；紧急情况拨打120。因用药、低血糖等需要进食时，应先保障健康，不能为打卡或返款挨饿、脱水、擅自停药或带病训练。\\n\\n90天减15—20斤为适合者的挑战方向，不保证所有人达到。个人目标与运动量需要结合身体情况调整。\\n\\n知情同意不免除经营者依法应承担的责任。演示问卷与内容不能作为医学安全证明。' },\n  privacy: { title: '健康信息处理说明', body: '开发演示草稿 · 上线前须补充真实运营主体、联系方式、保存期限与处理制度\\n\\n为健康服务范围筛查，我们收集年龄、身高、初始体重及必要健康问题的回答；入营后记录打卡、体重、腰围、订单、协议确认及相关服务申请。健康信息属于敏感个人信息，须单独同意后提供。\\n\\n演示模式：资料只保存在当前设备的小程序本地存储中，角色切换可访问虚构角色的数据。请使用虚构信息，不在演示版输入真实病史或其他敏感资料。可在“我的”重置本机演示数据。\\n\\n云模式：资料通过服务端按身份授权访问。本人可查看自己的健康与身体记录，其他营友不能读取；授权管理员仅为提供必要服务处理相关资料。\\n\\n发布心得前由本人选择是否分享照片或身体变化。系统不自动公开健康问卷、体重或病史。不要上传证件、病历或他人隐私。\\n\\n可通过“我的—个人数据申请”联系运营方处理查询、更正、撤回及删除请求；依法需要保留的交易或争议记录按适用规则处理。演示版申请只进入模拟管理队列，不代表已完成删除。\\n\\n真实上线前必须配置运营主体、联系渠道、各类数据保存期限、删除与备份流程、访问审计及用户隐私保护指引。目前这些生产制度尚未接入。' },\n  terms: { title: '服务与返款规则', body: '开发演示草稿 · 尚待法律审定，当前不提供真实收款\\n\\n一、服务\\n90天一般运动饮食教育、打卡支持、同期心得交流与周报。服务对象为35—55岁、符合服务范围的人。报名900元，不保证具体减重效果。\\n\\n二、周期\\n从开营日起每7天一个训练周，前12周共84天；第85—90天为最后6天。使用北京时间，不按自然周计算。\\n\\n三、打卡\\n当天运动与饮食均按个人计划完成计一个有效日；每周期最多两天免打卡，免打卡不计有效日，不跨周期累计。普通用户仅修改当天记录，系统故障可提出申诉。\\n\\n四、返款\\n完整训练周达到5个有效日可返70元；最后6天达到4个有效日可返60元，合计最多900元，不存在额外结营奖金。不达标只影响当期，不取消其他周期的资格，最终体重不追溯扣回周返款。\\n\\n周期结束后结算，按原支付订单退款。退款申请、处理中和已到账是不同状态，以实际支付渠道结果为准。演示版所有支付和退款均为模拟。\\n\\n五、暂停与争议\\n生病、受伤、系统故障及特殊情况可提交申请。未处理申请涉及的周期暂缓结算，运营方需联系用户处理。不得为返款带病运动。退出、取消和服务未提供等退款情形按正式协议及法律另行处理，不能一概不退。\\n\\n六、社群\\n心得先审核后发布，仅本期授权成员可见。禁止骚扰、泄露隐私、危险减重或擅自停药建议及不当广告，可举报并申请处理。\\n\\n七、上线前置事项\\n需补充运营主体、真实联系人、服务交付安排、退出与特殊退款细则、争议处理及必要专业审定。当前演示不代表已经具备正式经营资格或医疗认可。' }\n};\n","lib/domain.js":"'use strict';\n\nconst PRICE = 90000;\nconst RULES_VERSION = 'rules-draft-v1';\nconst DOCUMENT_VERSION = 'health-privacy-terms-draft-v1';\nconst DAY_MS = 86400000;\n\nfunction fail(code, message) {\n  const error = new Error(message);\n  error.code = code;\n  error.safe = true;\n  throw error;\n}\nfunction requireThat(condition, code, message) {\n  if (!condition) fail(code, message);\n}\nfunction parseDay(value) {\n  requireThat(typeof value === 'string' && /^\\d{4}-\\d{2}-\\d{2}$/.test(value), 'DATE', '日期格式应为YYYY-MM-DD');\n  const stamp = Date.parse(value + 'T00:00:00Z');\n  requireThat(Number.isFinite(stamp) && new Date(stamp).toISOString().slice(0, 10) === value, 'DATE', '日期不存在');\n  return stamp;\n}\nfunction businessDate(now) {\n  const stamp = new Date(now).getTime();\n  requireThat(Number.isFinite(stamp), 'DATE', '服务时间无效');\n  return new Date(stamp + 8 * 3600000).toISOString().slice(0, 10);\n}\nfunction addDays(date, amount) {\n  return new Date(parseDay(date) + amount * DAY_MS).toISOString().slice(0, 10);\n}\nfunction dayNumber(start, date) {\n  return Math.floor((parseDay(date) - parseDay(start)) / DAY_MS) + 1;\n}\nfunction periods(start) {\n  parseDay(start);\n  return Array.from({ length: 13 }, (_, index) => ({\n    index,\n    number: index + 1,\n    label: index === 12 ? '结营6天' : '第' + (index + 1) + '周',\n    start: addDays(start, index * 7),\n    end: addDays(start, index === 12 ? 89 : index * 7 + 6),\n    days: index === 12 ? 6 : 7,\n    required: index === 12 ? 4 : 5,\n    rewardFen: index === 12 ? 6000 : 7000\n  }));\n}\nfunction currentPeriod(start, today) {\n  const day = dayNumber(start, today);\n  return periods(start)[Math.min(12, Math.max(0, Math.floor((day - 1) / 7)))];\n}\nfunction recordKey(userId, campId, date) { return userId + ':' + campId + ':' + date; }\nfunction periodStats(state, enrollment, period) {\n  const rows = Array.from({ length: period.days }, (_, index) => {\n    const date = addDays(period.start, index);\n    const record = state.checkins[recordKey(enrollment.userId, enrollment.campId, date)];\n    return { date, short: date.slice(5), status: record ? record.status : 'missing' };\n  });\n  const valid = rows.filter(row => row.status === 'complete').length;\n  const exempt = rows.filter(row => row.status === 'exempt').length;\n  return { valid, exempt, remainingExempt: Math.max(0, 2 - exempt), qualified: valid >= period.required, rows };\n}\nfunction integer(value, min, max, message) {\n  const number = Number(value);\n  requireThat(Number.isInteger(number) && number >= min && number \u003c= max, 'INPUT', message);\n  return number;\n}\nfunction finiteNumber(value, min, max, message) {\n  requireThat(value !== '' && value !== null && value !== undefined, 'INPUT', message);\n  const number = Number(value);\n  requireThat(Number.isFinite(number) && number >= min && number \u003c= max, 'INPUT', message);\n  return Math.round(number * 10) / 10;\n}\nfunction text(value, min, max, message) {\n  requireThat(typeof value === 'string', 'INPUT', message);\n  const cleaned = value.trim();\n  requireThat(cleaned.length >= min && cleaned.length \u003c= max, 'INPUT', message);\n  return cleaned;\n}\nfunction money(fen) { return (fen / 100).toFixed(fen % 100 === 0 ? 0 : 2); }\n\nmodule.exports = { PRICE, RULES_VERSION, DOCUMENT_VERSION, fail, requireThat, businessDate, addDays, dayNumber, periods, currentPeriod, periodStats, recordKey, integer, finiteNumber, text, money };\n","lib/engine.js":"'use strict';\n\nconst D = require('./domain');\nconst Food = require('./nutrition');\nconst { requireThat: guard } = D;\nconst HEALTH_KEYS = ['cardiac', 'pressure', 'symptoms', 'glucose', 'injury', 'other'];\nconst HEALTH_QUESTIONS = [\n  '是否有心脑血管疾病，或医生要求限制运动的疾病？',\n  '是否有控制不佳或控制情况不明确的高血压？',\n  '是否运动时胸痛、晕厥或明显异常气促？',\n  '是否有低血糖风险、相关用药或近期反复低血糖？',\n  '是否近期手术、受伤或有明显影响运动的关节问题？',\n  '是否存在妊娠、进食障碍等不适合普通减脂计划的情况？'\n];\n\nfunction emptyState(date) {\n  return {\n    version: 1, sequence: 0, demoDate: date,\n    camps: [{ id: 'camp-1', title: '90天晨练减脂营', startDate: date, rulesVersion: D.RULES_VERSION }],\n    users: {}, consents: [], orders: {}, enrollments: {}, checkins: {}, bodies: [],\n    posts: [], reports: [], requests: [], settlements: {}, refunds: {}, audits: [], mealPlans: {}\n  };\n}\nfunction id(state, prefix) { state.sequence += 1; return prefix + '-' + state.sequence; }\nfunction today(state, ctx) { return ctx.mode === 'demo' ? state.demoDate : D.businessDate(ctx.now); }\nfunction timestamp(ctx) { return new Date(ctx.now).toISOString(); }\nfunction user(state, actor) {\n  guard(typeof actor === 'string' && actor.length > 0, 'AUTH', '请先登录');\n  if (!state.users[actor]) state.users[actor] = { id: actor, nickname: '新营友', healthStatus: 'unknown' };\n  return state.users[actor];\n}\nfunction isAdmin(actor, ctx) { return (ctx.adminIds || []).includes(actor); }\nfunction admin(actor, ctx) { guard(isAdmin(actor, ctx), 'FORBIDDEN', '需要管理员权限'); }\nfunction enrollment(state, actor, ctx) {\n  const row = state.enrollments[actor];\n  guard(row && state.orders[row.orderId] && state.orders[row.orderId].status === 'paid' && state.orders[row.orderId].mode === ctx.mode, 'PAYWALL', '请完成当前环境的健康准入并支付后入营');\n  return row;\n}\nfunction campFor(state, en) {\n  const camp = state.camps.find(item => item.id === en.campId);\n  guard(camp, 'CAMP', '期次不存在');\n  const order = state.orders[en.orderId];\n  return Object.assign({}, camp, { startDate: order.rulesSnapshot.startDate || camp.startDate });\n}\nfunction rulesSnapshot(camp) {\n  return { rulesVersion: camp.rulesVersion, documentVersion: D.DOCUMENT_VERSION, startDate: camp.startDate,\n    capFen: D.PRICE, weeklyFen: 7000, finalFen: 6000, extraBonusFen: 0, requiredDays: 5, finalRequiredDays: 4,\n    periods: D.periods(camp.startDate) };\n}\nfunction enrollmentPeriods(state, en) {\n  const rows = state.orders[en.orderId].rulesSnapshot.periods;\n  guard(Array.isArray(rows) && rows.length === 13, 'RULES', '订单营规快照不完整，请联系运营方');\n  return rows;\n}\nfunction enrollmentPeriod(state, en, date) {\n  const rows = enrollmentPeriods(state, en);\n  return rows.find(row => row.start \u003c= date && row.end >= date) || (date \u003c rows[0].start ? rows[0] : rows[12]);\n}\nfunction audit(state, actor, action, detail, ctx) {\n  state.audits.push({ id: id(state, 'audit'), actor, action, detail, at: timestamp(ctx) });\n}\nfunction moneyTotals(state, en) {\n  const rows = Object.values(state.refunds).filter(row => row.orderId === en.orderId);\n  return {\n    eligibleFen: rows.reduce((sum, row) => sum + row.amountFen, 0),\n    refundedFen: rows.filter(row => row.status === 'refunded').reduce((sum, row) => sum + row.amountFen, 0),\n    processingFen: rows.filter(row => row.status === 'processing').reduce((sum, row) => sum + row.amountFen, 0)\n  };\n}\nfunction publicPosts(state, actor, en) {\n  return state.posts.filter(post => post.campId === en.campId && (post.status === 'approved' || post.authorId === actor))\n    .filter(post => post.status !== 'deleted')\n    .map(post => ({ id: post.id, nickname: (state.users[post.authorId] || {}).nickname || '营友', text: post.text,\n      image: post.image || '', status: post.status, statusText: { pending: '待审核', approved: '已发布', hidden: '已隐藏', rejected: '未通过' }[post.status],\n      likeCount: post.likes.length, liked: post.likes.includes(actor), mine: post.authorId === actor, at: post.at.slice(0, 10) }));\n}\nfunction snapshot(state, actor, ctx) {\n  const me = user(state, actor);\n  const en = state.enrollments[actor];\n  const paid = !!(en && state.orders[en.orderId] && state.orders[en.orderId].status === 'paid' && state.orders[en.orderId].mode === ctx.mode);\n  const date = today(state, ctx);\n  const result = {\n    mode: ctx.mode, localDemo: ctx.localDemo === true, today: date, isAdmin: isAdmin(actor, ctx), paid,\n    me: { id: me.id, nickname: me.nickname, age: me.age || '', height: me.height || '', healthStatus: me.healthStatus },\n    healthQuestions: HEALTH_QUESTIONS, healthKeys: HEALTH_KEYS,\n    documentVersion: D.DOCUMENT_VERSION, price: '900',\n    nutrition: { preferences: me.foodPreferences || [], plans: (state.mealPlans || {})[actor] || {} },\n    camp: paid ? campFor(state, en) : state.camps.find(camp => camp.startDate >= date) || null,\n    bodies: state.bodies.filter(row => row.userId === actor).sort((a, b) => a.date.localeCompare(b.date)),\n    requests: state.requests.filter(row => row.userId === actor).map(row => ({ id: row.id, type: row.type, reason: row.reason, status: row.status, resolution: row.resolution || '' })),\n    orders: Object.values(state.orders).filter(row => row.userId === actor).map(row => ({ id: row.id, status: row.status, amount: D.money(row.amountFen), campId: row.campId, rulesVersion: row.rulesSnapshot.rulesVersion })),\n    posts: [], refunds: []\n  };\n  if (paid) {\n    const camp = result.camp;\n    const period = enrollmentPeriod(state, en, date);\n    const stats = D.periodStats(state, en, period);\n    const day = D.dayNumber(camp.startDate, date);\n    result.day = day;\n    result.started = day >= 1 && day \u003c= 90;\n    result.progress = Math.round(Math.min(90, Math.max(0, day - 1)) / 90 * 100);\n    result.period = Object.assign({}, period, stats);\n    result.currentRecord = state.checkins[D.recordKey(actor, en.campId, date)] || null;\n    result.totals = moneyTotals(state, en);\n    result.refunds = Object.values(state.refunds).filter(row => row.orderId === en.orderId).map(row => Object.assign({}, row, { amount: D.money(row.amountFen), label: row.periodIndex === 12 ? '结营6天' : '第' + (row.periodIndex + 1) + '周' }));\n    result.posts = publicPosts(state, actor, en);\n    result.weekly = enrollmentPeriods(state, en).map(item => Object.assign({}, item, D.periodStats(state, en, item), { settlement: (state.settlements[en.orderId + ':' + item.index] || {}).status || 'unsettled' }));\n  }\n  if (result.isAdmin) result.admin = adminSnapshot(state, date, ctx.reportPeriodIndex, ctx.mode);\n  return result;\n}\nfunction adminSnapshot(state, date, reportPeriodIndex, mode) {\n  const members = Object.values(state.enrollments).filter(en => state.orders[en.orderId].status === 'paid' && state.orders[en.orderId].mode === mode).map(en => {\n    const camp = campFor(state, en);\n    const p = reportPeriodIndex == null ? enrollmentPeriod(state, en, date) : enrollmentPeriods(state, en)[reportPeriodIndex];\n    const stats = D.periodStats(state, en, p);\n    const body = state.bodies.filter(row => row.userId === en.userId).sort((a, b) => a.date.localeCompare(b.date));\n    return { nickname: state.users[en.userId].nickname, camp: camp.title, campId: camp.id, period: p.label,\n      userId: en.userId, valid: stats.valid, required: p.required, qualified: stats.qualified, periodStarted: p.start \u003c= date,\n      rows: stats.rows.map(row => Object.assign({}, row, { symbol: { complete: '✓', partial: '半', exempt: '免', missing: '—' }[row.status] })),\n      pending: state.requests.some(row => row.userId === en.userId && row.status === 'pending'),\n      weightCount: body.length, changeKg: body.length >= 2 ? Math.round((body[body.length - 1].weight - body[0].weight) * 10) / 10 : null,\n      eligible: D.money(moneyTotals(state, en).eligibleFen), refunded: D.money(moneyTotals(state, en).refundedFen) };\n  });\n  const assessed = members.filter(row => !row.pending && row.periodStarted);\n  return { members, count: members.length, assessedCount: assessed.length,\n    qualifiedCount: assessed.filter(row => row.qualified).length,\n    rate: assessed.length ? Math.round(assessed.filter(row => row.qualified).length / assessed.length * 100) : null,\n    weightCount: members.filter(row => row.weightCount >= 2).length,\n    posts: state.posts.filter(row => row.status === 'pending' || row.status === 'hidden').map(row => ({ id: row.id, text: row.text, nickname: state.users[row.authorId].nickname, status: row.status })),\n    reports: state.reports.filter(row => row.status === 'pending'),\n    requests: state.requests.filter(row => row.status === 'pending').map(row => ({ id: row.id, type: row.type, reason: row.reason, nickname: state.users[row.userId].nickname })),\n    refunds: Object.values(state.refunds).filter(row => row.mode === mode).map(row => Object.assign({}, row, { amount: D.money(row.amountFen), nickname: state.users[state.orders[row.orderId].userId].nickname })),\n    audits: state.audits.slice(-30).reverse(), camps: state.camps };\n}\nfunction settle(state, actor, ctx) {\n  admin(actor, ctx);\n  const date = today(state, ctx);\n  for (const en of Object.values(state.enrollments)) {\n    const order = state.orders[en.orderId];\n    if (!order || order.status !== 'paid' || order.mode !== ctx.mode) continue;\n    const camp = campFor(state, en);\n    for (const period of enrollmentPeriods(state, en)) {\n      const key = en.orderId + ':' + period.index;\n      if (date \u003c= period.end || state.settlements[key]) continue;\n      if (state.requests.some(row => row.userId === en.userId && row.status === 'pending')) continue;\n      const stats = D.periodStats(state, en, period);\n      const eligible = stats.qualified;\n      if (eligible) {\n        const reserved = moneyTotals(state, en).eligibleFen;\n        guard(reserved + period.rewardFen \u003c= Math.min(D.PRICE, order.amountFen, order.rulesSnapshot.capFen), 'CAP', '累计退款超过订单实付，已阻止');\n        state.refunds[key] = { id: key, orderId: order.id, periodIndex: period.index, amountFen: period.rewardFen, status: 'eligible', mode: ctx.mode };\n      }\n      state.settlements[key] = { status: eligible ? 'qualified' : 'not_qualified', valid: stats.valid, required: period.required, at: timestamp(ctx) };\n      audit(state, actor, 'settle', key + ':' + state.settlements[key].status, ctx);\n    }\n  }\n}\n\nfunction handle(state, actor, action, payload, ctx) {\n  payload = payload || {};\n  const me = user(state, actor);\n  const date = today(state, ctx);\n  if (payload.reportPeriodIndex != null) {\n    admin(actor, ctx);\n    ctx = Object.assign({}, ctx, { reportPeriodIndex: D.integer(payload.reportPeriodIndex, 0, 12, '统计周期为1—13') });\n  }\n  switch (action) {\n    case 'view': {\n      if (payload.reportPeriodIndex != null) {\n        admin(actor, ctx);\n        ctx = Object.assign({}, ctx, { reportPeriodIndex: D.integer(payload.reportPeriodIndex, 0, 12, '统计周期为1—13') });\n      }\n      break;\n    }\n    case 'export': {\n      admin(actor, ctx);\n      const periodIndex = payload.reportPeriodIndex == null ? undefined : D.integer(payload.reportPeriodIndex, 0, 12, '统计周期为1—13');\n      const report = adminSnapshot(state, date, periodIndex, ctx.mode);\n      const cell = value => '\"' + String(value).replace(/^[=+@\\-\\t\\r]/, \"'$&\").replace(/\"/g, '\"\"') + '\"';\n      const rows = [['昵称', '期次', '周期', '有效天数', '要求天数', '待处理申请', '累计可返元', '已退款元']];\n      report.members.forEach(row => rows.push([row.nickname, row.camp, row.period, row.valid, row.required, row.pending ? '是' : '否', row.eligible, row.refunded]));\n      audit(state, actor, 'export_weekly', '不含健康问卷', ctx);\n      const view = snapshot(state, actor, ctx);\n      view.exportCsv = '\\ufeff' + rows.map(row => row.map(cell).join(',')).join('\\r\\n');\n      return view;\n    }\n    case 'screen': {\n      guard(payload.healthConsent === true && payload.privacyConsent === true, 'CONSENT', '请先分别同意健康告知和健康信息处理说明');\n      guard(payload.documentVersion === D.DOCUMENT_VERSION, 'CONSENT_VERSION', '协议版本已变更，请重新阅读');\n      const age = D.integer(payload.age, 35, 55, '首版服务年龄为35—55岁');\n      const height = D.finiteNumber(payload.height, 120, 230, '请输入有效身高（厘米）');\n      const weight = D.finiteNumber(payload.weight, 30, 300, '请输入有效体重（公斤）');\n      const answers = HEALTH_KEYS.map(key => payload.answers && payload.answers[key]);\n      guard(answers.every(value => ['no', 'yes', 'unsure'].includes(value)), 'SCREEN', '请完整回答全部健康问题');\n      const nickname = D.text(payload.nickname, 1, 16, '昵称为1—16字');\n      Object.assign(me, { age, height, nickname, healthStatus: answers.every(value => value === 'no') ? 'clear' : 'review', healthAnswers: Object.fromEntries(HEALTH_KEYS.map((key, index) => [key, answers[index]])) });\n      state.consents.push({ userId: actor, version: D.DOCUMENT_VERSION, health: true, privacy: true, at: timestamp(ctx) });\n      if (!state.bodies.some(row => row.userId === actor)) state.bodies.push({ userId: actor, date, weight, waist: null });\n      break;\n    }\n    case 'createOrder': {\n      guard(me.healthStatus === 'clear', 'HEALTH_REVIEW', '尚未通过服务范围筛查，暂不能支付');\n      guard(payload.termsConsent === true && payload.documentVersion === D.DOCUMENT_VERSION, 'TERMS', '请阅读并确认当前服务及退款规则');\n      guard(ctx.mode === 'demo', 'PAYMENT_NOT_CONFIGURED', '真实支付尚未接入，当前不能收款；不会自动模拟支付');\n      const camp = state.camps.filter(row => row.startDate >= date).sort((a, b) => a.startDate.localeCompare(b.startDate))[0];\n      guard(camp, 'CAMP', '暂无开放报名期次，请联系运营方');\n      guard(!state.enrollments[actor], 'ENROLLED', '您已经入营');\n      let order = Object.values(state.orders).find(row => row.userId === actor && row.campId === camp.id && row.status === 'unpaid');\n      if (!order) {\n        const orderId = id(state, 'order');\n        order = { id: orderId, userId: actor, campId: camp.id, amountFen: D.PRICE, status: 'unpaid', mode: ctx.mode,\n          rulesSnapshot: rulesSnapshot(camp), at: timestamp(ctx) };\n        state.orders[orderId] = order;\n        state.consents.push({ userId: actor, version: D.DOCUMENT_VERSION, terms: true, orderId, at: timestamp(ctx) });\n      }\n      break;\n    }\n    case 'simulatePayment': {\n      guard(ctx.mode === 'demo', 'DEMO_ONLY', '仅模拟环境可以模拟支付');\n      guard(me.healthStatus === 'clear', 'HEALTH_REVIEW', '尚未通过服务范围筛查');\n      const order = state.orders[payload.orderId];\n      guard(order && order.userId === actor && order.amountFen === D.PRICE && order.rulesSnapshot.documentVersion === D.DOCUMENT_VERSION, 'ORDER', '订单不存在或金额/协议不匹配');\n      guard(order.mode === 'demo', 'ORDER', '不能模拟真实订单');\n      if (order.status === 'paid') break;\n      guard(order.status === 'unpaid' && !state.enrollments[actor], 'ORDER', '订单状态不允许支付');\n      order.status = 'paid';\n      order.paidAt = timestamp(ctx);\n      state.enrollments[actor] = { userId: actor, campId: order.campId, orderId: order.id };\n      audit(state, actor, 'demo_payment', order.id, ctx);\n      break;\n    }\n    case 'checkin': {\n      const en = enrollment(state, actor, ctx);\n      const camp = campFor(state, en);\n      guard(!payload.date || payload.date === date, 'BACKDATE', '只能提交或修改当天记录，补签请联系管理员');\n      const day = D.dayNumber(camp.startDate, date);\n      guard(day >= 1 && day \u003c= 90, 'CAMP_DATES', '当前不在您的90天训练期内');\n      const key = D.recordKey(actor, en.campId, date);\n      const period = enrollmentPeriod(state, en, date);\n      const settlement = state.settlements[en.orderId + ':' + period.index];\n      guard(!settlement, 'LOCKED', '该周期已结算');\n      if (payload.exempt === true) {\n        const stats = D.periodStats(state, en, period);\n        guard((state.checkins[key] || {}).status === 'exempt' || stats.exempt \u003c 2, 'EXEMPT_LIMIT', '本周期两天免打卡已用完');\n        state.checkins[key] = { status: 'exempt', date, userId: actor, campId: en.campId };\n      } else {\n        const minutes = D.integer(payload.minutes, 0, 180, '运动时长为0—180分钟，请按个人计划填写');\n        guard(typeof payload.exerciseDone === 'boolean' && typeof payload.dietDone === 'boolean', 'INPUT', '请确认运动和饮食完成状态');\n        guard(!payload.exerciseDone || minutes > 0, 'INPUT', '完成运动时请填写大于0的时长');\n        const exercise = D.text(payload.exercise, 1, 20, '请选择活动类型');\n        guard(typeof payload.dinnerTime === 'string' && /^([01]\\d|2[0-3]):[0-5]\\d$/.test(payload.dinnerTime), 'INPUT', '请填写晚餐时间');\n        guard((payload.mealDone == null || typeof payload.mealDone === 'boolean') && (payload.eveningDone == null || typeof payload.eveningDone === 'boolean'), 'INPUT', '请确认三餐和晚间记录状态');\n        const mealDone = payload.mealDone == null ? payload.dietDone : payload.mealDone;\n        const eveningDone = payload.eveningDone == null ? payload.dietDone : payload.eveningDone;\n        const dietDone = payload.dietDone && mealDone && eveningDone;\n        state.checkins[key] = { status: payload.exerciseDone && dietDone ? 'complete' : 'partial', date, userId: actor, campId: en.campId,\n          exercise, minutes, exerciseDone: payload.exerciseDone, dietDone, mealDone, eveningDone, dinnerTime: payload.dinnerTime };\n      }\n      break;\n    }\n    case 'mealPlan': {\n      enrollment(state, actor, ctx);\n      const avoid = Food.preferences(payload.preferences || []);\n      const plan = Food.validate(payload.meal, payload.plan, avoid);\n      if (!state.mealPlans) state.mealPlans = {};\n      if (!state.mealPlans[actor]) state.mealPlans[actor] = {};\n      state.mealPlans[actor][payload.meal] = Object.assign({}, plan, { updatedAt: timestamp(ctx) });\n      me.foodPreferences = avoid;\n      break;\n    }\n    case 'body': {\n      enrollment(state, actor, ctx);\n      const weight = D.finiteNumber(payload.weight, 30, 300, '体重为30—300公斤');\n      const waist = payload.waist === '' || payload.waist == null ? null : D.finiteNumber(payload.waist, 40, 200, '腰围为40—200厘米');\n      const old = state.bodies.find(row => row.userId === actor && row.date === date);\n      if (old) Object.assign(old, { weight, waist }); else state.bodies.push({ userId: actor, date, weight, waist });\n      break;\n    }\n    case 'post': {\n      const en = enrollment(state, actor, ctx);\n      const content = D.text(payload.text, 1, 600, '心得为1—600字');\n      guard(state.posts.length \u003c 150, 'CAPACITY', '试营心得容量已满，请联系管理员归档');\n      guard(!payload.image || (ctx.mode === 'demo' && ctx.localDemo === true && typeof payload.image === 'string' && /^(wxfile:\\/\\/|http:\\/\\/(tmp|usr)\\/)/.test(payload.image)), 'IMAGE', '图片仅支持本机演示选择；云端图片审核尚未接入');\n      state.posts.unshift({ id: id(state, 'post'), authorId: actor, campId: en.campId, text: content, image: payload.image || '', likes: [], status: 'pending', at: timestamp(ctx) });\n      break;\n    }\n    case 'like': case 'report': {\n      const en = enrollment(state, actor, ctx);\n      const post = state.posts.find(row => row.id === payload.postId && row.campId === en.campId && row.status === 'approved');\n      guard(post, 'POST', '该内容不可访问');\n      if (action === 'like') {\n        post.likes = post.likes.includes(actor) ? post.likes.filter(item => item !== actor) : post.likes.concat(actor);\n      } else {\n        const reason = D.text(payload.reason, 1, 120, '请填写举报原因');\n        if (!state.reports.some(row => row.userId === actor && row.postId === post.id && row.status === 'pending')) state.reports.push({ id: id(state, 'report'), userId: actor, postId: post.id, reason, status: 'pending' });\n      }\n      break;\n    }\n    case 'request': {\n      guard(['暂停/调整', '系统故障申诉', '退出/退款咨询', '个人数据申请'].includes(payload.type), 'INPUT', '申请类型不支持');\n      if (payload.type !== '个人数据申请') enrollment(state, actor, ctx);\n      const reason = D.text(payload.reason, 2, 300, '请填写2—300字说明，不要上传病历或证件');\n      guard(!state.requests.some(row => row.userId === actor && row.status === 'pending'), 'PENDING', '已有待处理申请，请等待联系');\n      state.requests.push({ id: id(state, 'request'), userId: actor, type: payload.type, reason, status: 'pending', at: timestamp(ctx) });\n      break;\n    }\n    case 'moderate': {\n      admin(actor, ctx);\n      const post = state.posts.find(row => row.id === payload.postId);\n      guard(post && ['approved', 'rejected', 'hidden'].includes(payload.status), 'POST', '审核对象或状态无效');\n      post.status = payload.status;\n      state.reports.filter(row => row.postId === post.id).forEach(row => { row.status = 'resolved'; });\n      audit(state, actor, 'moderate', post.id + ':' + post.status, ctx);\n      break;\n    }\n    case 'resolveRequest': {\n      admin(actor, ctx);\n      const request = state.requests.find(row => row.id === payload.requestId);\n      guard(request && request.status === 'pending', 'REQUEST', '申请不存在或已处理');\n      request.resolution = D.text(payload.resolution, 2, 300, '请填写处理结果与已告知用户的安排');\n      request.status = 'resolved';\n      audit(state, actor, 'resolve_request', request.id, ctx);\n      break;\n    }\n    case 'settle': settle(state, actor, ctx); break;\n    case 'processRefunds': case 'confirmRefunds': {\n      admin(actor, ctx);\n      guard(ctx.mode === 'demo', 'REFUND_NOT_CONFIGURED', '真实退款适配器尚未接入，不会模拟到账');\n      for (const refund of Object.values(state.refunds)) {\n        if (action === 'processRefunds' && ['eligible', 'failed'].includes(refund.status)) refund.status = 'processing';\n        else if (action === 'confirmRefunds' && refund.status === 'processing') refund.status = 'refunded';\n      }\n      audit(state, actor, action, 'DEMO_ONLY', ctx);\n      break;\n    }\n    case 'advanceDemo': {\n      admin(actor, ctx);\n      guard(ctx.mode === 'demo', 'DEMO_ONLY', '真实环境不能修改时间');\n      state.demoDate = D.addDays(date, D.integer(payload.days, 1, 100, '推进天数为1—100天'));\n      settle(state, actor, ctx);\n      break;\n    }\n    default: D.fail('ACTION', '不支持的操作');\n  }\n  return snapshot(state, actor, ctx);\n}\n\nfunction demoState(baseDate) {\n  const state = emptyState(D.addDays(baseDate, -7));\n  state.demoDate = baseDate;\n  state.camps[0].title = '晨光一期 · 90天同行';\n  state.camps.push({ id: 'camp-2', title: '晨光二期 · 新人招募', startDate: D.addDays(baseDate, 2), rulesVersion: D.RULES_VERSION });\n  const ctx = { mode: 'demo', now: baseDate + 'T02:00:00Z', adminIds: ['demo-admin'] };\n  for (const [userId, nickname, days] of [['demo-member', '林晓', 5], ['demo-peer', '周远', 4]]) {\n    state.users[userId] = { id: userId, nickname, age: 42, height: 168, healthStatus: 'clear' };\n    const orderId = 'seed-' + userId;\n    state.orders[orderId] = { id: orderId, userId, campId: 'camp-1', amountFen: D.PRICE, status: 'paid', mode: 'demo', rulesSnapshot: rulesSnapshot(state.camps[0]) };\n    state.enrollments[userId] = { userId, campId: 'camp-1', orderId };\n    for (let index = 0; index \u003c 7; index++) {\n      const date = D.addDays(state.camps[0].startDate, index);\n      state.checkins[D.recordKey(userId, 'camp-1', date)] = { date, userId, campId: 'camp-1', status: index \u003c days ? 'complete' : index \u003c days + 2 ? 'exempt' : 'partial' };\n    }\n    state.bodies.push({ userId, date: state.camps[0].startDate, weight: userId === 'demo-member' ? 82 : 88, waist: 96 });\n    state.bodies.push({ userId, date: baseDate, weight: userId === 'demo-member' ? 81.4 : 87.8, waist: 95 });\n  }\n  state.posts.push({ id: 'welcome-post', authorId: 'demo-peer', campId: 'camp-1', text: '这一周没有拼速度，早上先快走。把早餐提前准备好，出门也从容了。一起慢慢坚持。', image: '', likes: [], status: 'approved', at: timestamp(ctx) });\n  state.users['demo-admin'] = { id: 'demo-admin', nickname: '营长', healthStatus: 'unknown' };\n  state.users['demo-visitor'] = { id: 'demo-visitor', nickname: '新营友', healthStatus: 'unknown' };\n  settle(state, 'demo-admin', ctx);\n  return state;\n}\n\nmodule.exports = { HEALTH_KEYS, HEALTH_QUESTIONS, emptyState, demoState, handle, snapshot, settle, moneyTotals };\n","lib/nutrition.js":"'use strict';\nconst D = require('./domain');\nconst MEALS = [\n  { id: 'breakfast', name: '早餐', english: 'BREAKFAST', time: '07:30', note: '蛋白质和主食一起吃，给清晨一个稳稳的开始。' },\n  { id: 'lunch', name: '午餐', english: 'LUNCH', time: '12:00', note: '蔬菜占半盘，搭配蛋白质与适量主食，正常吃饱。' },\n  { id: 'dinner', name: '晚餐', english: 'EARLY DINNER', time: '17:30', note: '17—18点完成一顿完整、方便的晚餐，不以挨饿为目标。' }\n];\nconst FOOD = [\n  { id: 'oats', group: 'grain', name: '燕麦', portion: '约半碗熟燕麦', meals: ['breakfast'], tags: [] },\n  { id: 'bread', group: 'grain', name: '全麦面包', portion: '约1—2片', tags: [] },\n  { id: 'corn', group: 'grain', name: '玉米', portion: '约1小根', tags: [] },\n  { id: 'sweetpotato', group: 'grain', name: '红薯', portion: '约1小个', tags: [] },\n  { id: 'rice', group: 'grain', name: '杂粮饭', portion: '约1拳熟饭', meals: ['lunch', 'dinner'], tags: [] },\n  { id: 'noodles', group: 'grain', name: '荞麦面', portion: '约1拳熟面', meals: ['lunch', 'dinner'], tags: [] },\n  { id: 'egg', group: 'protein', name: '鸡蛋', portion: '约1—2个，结合其他食物调整', tags: ['egg'] },\n  { id: 'chicken', group: 'protein', name: '去皮鸡肉', portion: '约1掌熟肉', tags: [] },\n  { id: 'fish', group: 'protein', name: '清蒸鱼', portion: '约1掌鱼肉', meals: ['lunch', 'dinner'], tags: ['seafood'] },\n  { id: 'shrimp', group: 'protein', name: '虾仁', portion: '约1掌', meals: ['lunch', 'dinner'], tags: ['seafood'] },\n  { id: 'beef', group: 'protein', name: '瘦牛肉', portion: '约1掌熟肉', meals: ['lunch', 'dinner'], tags: [] },\n  { id: 'tofu', group: 'protein', name: '北豆腐', portion: '约1掌厚块，份量可调整', tags: ['soy'] },\n  { id: 'yogurt', group: 'protein', name: '原味无糖酸奶', portion: '约1杯，可搭配其他蛋白质', meals: ['breakfast'], tags: ['milk'] },\n  { id: 'tomato', group: 'produce', name: '番茄', portion: '约1拳', tags: [] },\n  { id: 'cucumber', group: 'produce', name: '黄瓜', portion: '约1拳', tags: [] },\n  { id: 'broccoli', group: 'produce', name: '西兰花', portion: '约1拳', tags: [] },\n  { id: 'spinach', group: 'produce', name: '菠菜', portion: '约1拳熟菜', tags: [] },\n  { id: 'lettuce', group: 'produce', name: '生菜', portion: '约1—2拳', tags: [] },\n  { id: 'cabbage', group: 'produce', name: '圆白菜', portion: '约1拳', tags: [] },\n  { id: 'bokchoy', group: 'produce', name: '小白菜', portion: '约1拳熟菜', tags: [] },\n  { id: 'asparagus', group: 'produce', name: '芦笋', portion: '约1拳', tags: [] },\n  { id: 'mushroom', group: 'produce', name: '菌菇', portion: '约1拳', tags: [] },\n  { id: 'pepper', group: 'produce', name: '彩椒', portion: '约1拳', tags: [] },\n  { id: 'zucchini', group: 'produce', name: '西葫芦', portion: '约1拳', tags: [] },\n  { id: 'carrot', group: 'produce', name: '胡萝卜', portion: '约1拳', tags: [] },\n  { id: 'cauliflower', group: 'produce', name: '菜花', portion: '约1拳', tags: [] },\n  { id: 'celery', group: 'produce', name: '芹菜', portion: '约1拳', tags: [] },\n  { id: 'milk', group: 'extra', name: '无糖奶', portion: '约1杯', tags: ['milk'] },\n  { id: 'soymilk', group: 'extra', name: '无糖豆浆', portion: '约1杯', tags: ['soy'] },\n  { id: 'apple', group: 'extra', name: '苹果', portion: '约1小个', tags: [] },\n  { id: 'berries', group: 'extra', name: '莓果', portion: '约1小把', tags: [] },\n  { id: 'orange', group: 'extra', name: '橙子', portion: '约1小个', tags: [] },\n  { id: 'nuts', group: 'extra', name: '原味坚果', portion: '按小份取用，不边吃边添', tags: ['nuts'] }\n];\nconst AVOIDS = [{ id: 'milk', name: '不选奶类' }, { id: 'egg', name: '不选蛋类' }, { id: 'seafood', name: '不选鱼虾' }, { id: 'soy', name: '不选大豆' }, { id: 'nuts', name: '不选坚果' }];\nconst GROUPS = [\n  { id: 'grain', number: '01', name: '选一份主食', hint: '从约1拳熟食起步，结合个人需要调整。', field: 'grainId' },\n  { id: 'protein', number: '02', name: '选一份蛋白质', hint: '肉、鱼、蛋、豆制品轮换，烹饪尽量少油。', field: 'proteinId' },\n  { id: 'produce', number: '03', name: '选1—2种蔬菜', hint: '午晚餐争取蔬菜占半盘，深浅颜色搭配。', field: 'produceIds' },\n  { id: 'extra', number: '04', name: '再加一份，可选', hint: '水果、奶或少量坚果按全天饮食安排，不必每样都吃。', field: 'extraId' }\n];\nconst PRESETS = [{ id: 'balanced', name: '家常均衡' }, { id: 'convenient', name: '便利轻食' }, { id: 'plant', name: '植物友好' }];\nconst BASE = {\n  breakfast: { grainId: 'oats', proteinId: 'egg', produceIds: ['tomato', 'cucumber'], extraId: 'milk' },\n  lunch: { grainId: 'rice', proteinId: 'chicken', produceIds: ['broccoli', 'mushroom'], extraId: 'apple' },\n  dinner: { grainId: 'corn', proteinId: 'tofu', produceIds: ['lettuce', 'tomato'], extraId: 'milk' }\n};\nfunction allowed(food, meal, preferences) { return (!food.meals || food.meals.includes(meal)) && !food.tags.some(tag => preferences.includes(tag)); }\nfunction options(meal, preferences, group) { return FOOD.filter(food => food.group === group && allowed(food, meal, preferences)); }\nfunction preferences(input) {\n  D.requireThat(Array.isArray(input) && input.length \u003c= AVOIDS.length && input.every(id => AVOIDS.some(row => row.id === id)), 'MEAL', '食材偏好无效');\n  return Array.from(new Set(input));\n}\nfunction preset(meal, kind, avoid = []) {\n  D.requireThat(MEALS.some(item => item.id === meal), 'MEAL', '餐次无效');\n  const plan = Object.assign({}, BASE[meal], { produceIds: BASE[meal].produceIds.slice() });\n  if (kind === 'convenient') Object.assign(plan, { grainId: meal === 'lunch' ? 'sweetpotato' : 'bread', proteinId: 'egg', produceIds: ['tomato', 'cucumber'], extraId: 'apple' });\n  if (kind === 'plant') Object.assign(plan, { proteinId: 'tofu', extraId: meal === 'breakfast' ? 'soymilk' : 'orange' });\n  for (const group of GROUPS) {\n    const available = options(meal, avoid, group.id);\n    if (group.id === 'produce') plan.produceIds = plan.produceIds.filter(id => available.some(row => row.id === id));\n    else if (!available.some(row => row.id === plan[group.field])) plan[group.field] = group.id === 'extra' ? '' : available[0].id;\n  }\n  if (!plan.produceIds.length) plan.produceIds = [options(meal, avoid, 'produce')[0].id];\n  return plan;\n}\nfunction validate(meal, input, avoid) {\n  D.requireThat(MEALS.some(row => row.id === meal), 'MEAL', '请选择早餐、午餐或晚餐');\n  D.requireThat(input && typeof input === 'object', 'MEAL', '请先选择搭配');\n  const select = (field, group) => {\n    const value = input[field];\n    D.requireThat(typeof value === 'string' && options(meal, avoid, group).some(row => row.id === value), 'MEAL', '搭配包含不适合当前餐次或已避开的食材');\n    return value;\n  };\n  const grainId = select('grainId', 'grain'); const proteinId = select('proteinId', 'protein');\n  D.requireThat(Array.isArray(input.produceIds) && input.produceIds.length >= 1 && input.produceIds.length \u003c= 2 && new Set(input.produceIds).size === input.produceIds.length, 'MEAL', '请选择1—2种不同蔬菜');\n  const produceIds = input.produceIds.map(id => {\n    D.requireThat(options(meal, avoid, 'produce').some(row => row.id === id), 'MEAL', '蔬菜选项无效'); return id;\n  });\n  const extraId = input.extraId ? select('extraId', 'extra') : '';\n  return { grainId, proteinId, produceIds, extraId };\n}\nfunction summary(meal, saved, avoid = []) {\n  const plan = saved || preset(meal, 'balanced', avoid);\n  const ids = [plan.grainId, plan.proteinId].concat(plan.produceIds || [], plan.extraId || []).filter(Boolean);\n  const foods = ids.map(id => FOOD.find(row => row.id === id)).filter(Boolean);\n  return Object.assign({}, MEALS.find(row => row.id === meal), { text: foods.map(food => food.name).join(' · '), saved: !!saved,\n    needsReview: foods.some(food => !allowed(food, meal, avoid)) });\n}\nmodule.exports = { MEALS, FOOD, AVOIDS, GROUPS, PRESETS, options, preferences, preset, validate, summary };\n","lib/service.js":"const Engine = require('./engine');\nconst D = require('./domain');\n\nfunction clone(value) { return JSON.parse(JSON.stringify(value)); }\nfunction createLocalService(storage, clock) {\n  const now = clock || (() => new Date());\n  let state = storage.get('camp-state-v1') || Engine.demoState(D.businessDate(now()));\n  let actor = storage.get('camp-actor') || 'demo-member';\n  function save() { storage.set('camp-state-v1', state); storage.set('camp-actor', actor); }\n  const context = () => ({ mode: 'demo', localDemo: true, now: now(), adminIds: ['demo-admin'] });\n  save();\n  return {\n    mode: 'demo',\n    async call(action, payload) {\n      // 一次操作全部成功才提交，失败不保留半份订单、记录或退款。\n      const draft = clone(state);\n      const result = Engine.handle(draft, actor, action, payload, context());\n      state = draft;\n      save();\n      return clone(result);\n    },\n    switchActor(value) {\n      if (!['demo-member', 'demo-peer', 'demo-visitor', 'demo-admin'].includes(value)) D.fail('ACTOR', '演示身份无效');\n      actor = value; save();\n    },\n    async jumpToStart() {\n      const en = state.enrollments[actor];\n      D.requireThat(en, 'PAYWALL', '请先完成模拟报名');\n      const start = state.camps.find(row => row.id === en.campId).startDate;\n      D.requireThat(start > state.demoDate, 'DATE', '您已在训练期内，无需跳转');\n      state.demoDate = start; save();\n      return this.call('view');\n    },\n    reset() { state = Engine.demoState(D.businessDate(now())); actor = 'demo-member'; save(); }\n  };\n}\nfunction createCloudService(wxApi, config) {\n  D.requireThat(config.cloudEnv, 'CLOUD_CONFIG', '请先配置云环境ID；当前不会降级为模拟模式');\n  wxApi.cloud.init({ env: config.cloudEnv, traceUser: true });\n  return {\n    mode: 'cloud',\n    async call(action, payload) {\n      const response = await wxApi.cloud.callFunction({ name: config.apiFunction, data: { action, payload: payload || {} } });\n      const result = response.result;\n      if (!result || !result.ok) D.fail(result && result.code || 'CLOUD', result && result.message || '云服务返回异常');\n      return result.data;\n    }\n  };\n}\nmodule.exports = { createLocalService, createCloudService };\n","lib/ui.js":"const D = require('./domain');\nconst Food = require('./nutrition');\nconst Brand = require('./brand');\nconst REFUND_LABELS = { eligible: '已取得资格', processing: '退款处理中', refunded: '已退款', failed: '退款失败' };\nfunction decorate(view) {\n  const data = Object.assign({}, view);\n  data.brand = Brand;\n  data.mealCards = Food.MEALS.map(meal => Food.summary(meal.id, view.nutrition && view.nutrition.plans[meal.id], view.nutrition && view.nutrition.preferences || []));\n  data.dayNumberText = String(Math.min(90, Math.max(1, view.day || 1))).padStart(2, '0');\n  data.healthLabel = { unknown: '尚未填写', clear: '符合当前服务范围', review: '待进一步评估' }[view.me.healthStatus];\n  if (view.period) {\n    data.period = Object.assign({}, view.period, { reward: D.money(view.period.rewardFen),\n      rows: view.period.rows.map(row => Object.assign({}, row, { symbol: { complete: '✓', partial: '半', exempt: '免', missing: '—' }[row.status] })) });\n    data.validPercent = Math.min(100, Math.round(view.period.valid / view.period.required * 100));\n    data.eligible = D.money(view.totals.eligibleFen);\n    data.refunded = D.money(view.totals.refundedFen);\n    data.dayLabel = view.day \u003c 1 ? '等待开营' : view.day > 90 ? '本期已结营' : '第 ' + view.day + ' / 90 天';\n  }\n  data.refunds = (view.refunds || []).map(row => Object.assign({}, row, { statusLabel: REFUND_LABELS[row.status] || row.status }));\n  const bodies = view.bodies || [];\n  const first = bodies[0];\n  const latest = bodies[bodies.length - 1];\n  data.latestWeight = latest ? latest.weight : '—';\n  data.weightChange = first && latest && bodies.length > 1 ? Math.round((latest.weight - first.weight) * 10) / 10 : null;\n  data.bodyRows = bodies.slice(-8).map(row => Object.assign({}, row, { bar: Math.round(Math.min(100, Math.max(8, row.weight / 150 * 100))) }));\n  if (data.admin) data.admin.refunds = data.admin.refunds.map(row => Object.assign({}, row, { statusLabel: REFUND_LABELS[row.status] || row.status }));\n  return data;\n}\nfunction showError(error) { wx.showToast({ title: error.message || '操作失败，请重试', icon: 'none', duration: 3000 }); }\nasync function refresh(page) {\n  try {\n    page.setData({ loading: true, error: '' });\n    const view = decorate(await getApp().service.call('view'));\n    page.setData({ view, loading: false });\n    return view;\n  } catch (error) { page.setData({ loading: false, error: error.message }); showError(error); return null; }\n}\nasync function perform(page, action, payload, success) {\n  if (page.data.busy) return null;\n  page.setData({ busy: true });\n  try {\n    const view = decorate(await getApp().service.call(action, payload));\n    page.setData({ view });\n    if (success) wx.showToast({ title: success, icon: 'success' });\n    return view;\n  } catch (error) { showError(error); return null; }\n  finally { page.setData({ busy: false }); }\n}\nfunction formInput(page, event) { page.setData({ [event.currentTarget.dataset.field]: event.detail.value }); }\nmodule.exports = { refresh, perform, decorate, showError, formInput };\n","pages/admin/index.js":"const UI = require('../../lib/ui');\nPage({\n  data: { view: null, loading: true, busy: false, error: '', periods: ['当前周期', '第1周', '第2周', '第3周', '第4周', '第5周', '第6周', '第7周', '第8周', '第9周', '第10周', '第11周', '第12周', '结营6天'], periodChoice: 0 },\n  onShow() { this.setData({ periodChoice: 0 }); return UI.refresh(this); },\n  retry() { return this.onShow(); },\n  periodPayload() { return this.data.periodChoice ? { reportPeriodIndex: this.data.periodChoice - 1 } : {}; },\n  async choosePeriod(event) { this.setData({ periodChoice: Number(event.detail.value) }); await UI.perform(this, 'view', this.periodPayload()); },\n  action(event) { return UI.perform(this, event.currentTarget.dataset.action, this.periodPayload(), '操作完成'); },\n  moderate(event) { return UI.perform(this, 'moderate', Object.assign({}, this.periodPayload(), { postId: event.currentTarget.dataset.id, status: event.currentTarget.dataset.status }), '审核已保存'); },\n  resolve(event) {\n    const requestId = event.currentTarget.dataset.id;\n    wx.showModal({ title: '记录处理结果', editable: true, placeholderText: '填写与用户沟通的结果；此处不提供医学放行', success: result => {\n      if (result.confirm) return UI.perform(this, 'resolveRequest', Object.assign({}, this.periodPayload(), { requestId, resolution: result.content }), '处理结果已保存');\n    } });\n  },\n  async exportCsv() {\n    const view = await UI.perform(this, 'export', this.periodPayload());\n    if (view) wx.setClipboardData({ data: view.exportCsv });\n  },\n  advance(event) { return UI.perform(this, 'advanceDemo', Object.assign({}, this.periodPayload(), { days: Num </script><script>/* global PREVIEW_SOURCES, PREVIEW_WXML */
'use strict';
(function browserPreview() {
  const screen = document.getElementById('screen');
  const phone = document.querySelector('.phone');
  const definitions = {};
  const frames = {};
  const modules = {};
  const memory = new Map();
  let app;
  let registering = '';
  let active = 'today';
  let stack = [];
  let queued = false;
  let typing = false;
  let toastTimer;
  let dialogFinish;
  const clone = value => value == null ? value : JSON.parse(JSON.stringify(value));
  const titles = { today: '晨序 · 今日', nutrition: '三餐搭配 · 晨序', community: '营友 · 一起坚持', profile: '我的 · 看见进步', enroll: '报名 · 90天同行', agreement: '服务说明', admin: '管理工作台' };
  function readStorage(key) {
    if (memory.has(key)) return clone(memory.get(key));
    try { const value = localStorage.getItem('morning-preview:' + key); return value ? JSON.parse(value) : undefined; }
    catch (_) { return clone(memory.get(key)); }
  }
  function writeStorage(key, value) {
    memory.set(key, clone(value));
    try { localStorage.setItem('morning-preview:' + key, JSON.stringify(value)); }
    catch (_) { /* 隐私模式可能禁用本机存储，此时本次打开仍可操作。 */ }
  }
  function toast(message) {
    const node = document.getElementById('toast'); node.textContent = message; node.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { node.hidden = true; }, 2600);
  }
  function schedule() {
    if (queued || typing) return;
    queued = true;
    queueMicrotask(() => { queued = false; paint(); });
  }
  function resolve(from, request) {
    const parts = (from.slice(0, from.lastIndexOf('/') + 1) + request).split('/');
    const result = [];
    for (const item of parts) { if (item === '..') result.pop(); else if (item && item !== '.') result.push(item); }
    const filename = result.join('/'); return filename.endsWith('.js') ? filename : filename + '.js';
  }
  function load(filename) {
    if (modules[filename]) return modules[filename].exports;
    if (!Object.prototype.hasOwnProperty.call(PREVIEW_SOURCES, filename)) throw new Error('预览模块缺失：' + filename);
    const module = { exports: {} }; modules[filename] = module;
    new Function('require', 'module', 'exports', PREVIEW_SOURCES[filename])(request => load(resolve(filename, request)), module, module.exports);
    return module.exports;
  }
  window.App = definition => { app = definition; };
  window.getApp = () => app;
  window.Page = definition => { definitions[registering] = definition; };
  function frame(name) {
    if (!frames[name]) {
      registering = name; load('pages/' + name + '/index.js'); registering = '';
      const definition = definitions[name];
      const page = Object.assign({}, definition, { data: clone(definition.data) });
      page.setData = function setData(update) {
        for (const [key, value] of Object.entries(update)) {
          const parts = key.split('.'); let node = this.data;
          for (const part of parts.slice(0, -1)) { if (!node[part]) node[part] = {}; node = node[part]; }
          node[parts[parts.length - 1]] = value;
        }

      };
      frames[name] = page;
    }

  }
  function eventFor(node, value) { return { currentTarget: { dataset: Object.assign({}, node.dataset) }, detail: { value } }; }

    if (typeof page[handler] !== 'function') return;
    try {
      typing = !!isInput;
      const result = page[handler](eventFor(node, value));
      typing = false;
      if (result && typeof result.then === 'function') { await result; schedule(); }
    } catch (error) { typing = false; toast(error.message || '操作失败'); }
  }
  async function navigate(url, tab) {
    const [pathname, query] = url.split('?');
    const name = pathname.split('/')[2];
    if (!titles[name]) return;
    if (tab) stack = []; else if (active !== name) stack.push(active);
    active = name;
    document.getElementById('page-title').textContent = titles[name];
    const page = frame(name);
    if (page.onLoad) page.onLoad(Object.fromEntries(new URLSearchParams(query || '')));
    if (page.onShow) await page.onShow();
    screen.scrollTop = 0; paint();
  }
  async function back() {
    active = stack.pop() || 'today';
    document.getElementById('page-title').textContent = titles[active];
    if (frame(active).onShow) await frame(active).onShow();
    paint();
  }
  function modal(options, list) {
    const dialog = document.getElementById('dialog');
    if (dialog.open) dialog.close();
    document.getElementById('dialog-title').textContent = options.title || '请选择';
    document.getElementById('dialog-body').textContent = options.content || '';
    const input = document.getElementById('dialog-input'); input.hidden = !options.editable; input.value = ''; input.placeholder = options.placeholderText || '';
    const choices = document.getElementById('dialog-options'); choices.replaceChildren();
    const confirm = document.getElementById('dialog-confirm'); confirm.textContent = options.confirmText || '确定'; confirm.hidden = !!list;
    dialogFinish = async (accepted, tapIndex) => {
      dialog.close();
      if (accepted && options.success) await options.success(list ? { tapIndex } : { confirm: true, cancel: false, content: input.value });
      else if (!list && options.success) await options.success({ confirm: false, cancel: true });
      schedule();
    };
    if (list) list.forEach((label, index) => { const button = document.createElement('button'); button.textContent = label; button.onclick = () => dialogFinish(true, index); choices.appendChild(button); });
    dialog.showModal();
    if (options.editable) input.focus();
  }
  document.getElementById('dialog-confirm').onclick = () => dialogFinish(true);
  document.getElementById('dialog-cancel').onclick = () => dialogFinish(false);
  document.getElementById('dialog').addEventListener('cancel', () => { if (dialogFinish) dialogFinish(false); });

  window.wx = {
    nextTick: callback => queueMicrotask(callback),
    pageScrollTo: options => { const target = screen.querySelector(options.selector); if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
    getStorageSync: readStorage, setStorageSync: writeStorage,
    showToast: options => toast(options.title),
    showModal: options => modal(options),
    showActionSheet: options => modal(options, options.itemList),
    navigateTo: options => navigate(options.url, false),
    switchTab: options => navigate(options.url, true),
    setNavigationBarTitle: options => { document.getElementById('page-title').textContent = options.title; },
    setClipboardData(options) {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(options.data).then(() => toast('统计表已复制')).catch(() => downloadCSV(options.data));
      else downloadCSV(options.data);
    },
    chooseMedia(options) {
      const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
      input.onchange = () => {
        const file = input.files[0]; if (!file) return;
        if (file.size > 2 * 1024 * 1024) return toast('预览版请选择小于2MB的图片');
        const reader = new FileReader();
        reader.onload = () => {
          const key = 'wxfile://preview/' + Date.now();
          try { writeStorage('image:' + key, reader.result); options.success({ tempFiles: [{ tempFilePath: key }] }); }
          catch (_) { toast('图片保存失败，请换较小图片'); }
        };
        reader.readAsDataURL(file);
      };
      input.click();
    },
    getFileSystemManager() { return { saveFile(options) { options.success({ savedFilePath: options.tempFilePath }); } }; }
  };
  function downloadCSV(data) {
    const url = URL.createObjectURL(new Blob([data], { type: 'text/csv;charset=utf-8' }));
    const link = document.createElement('a'); link.href = url; link.download = '晨光营周报.csv'; link.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000); toast('预览版：统计表已下载为CSV');
  }
  const renderer = new Function('global', PREVIEW_WXML)({});
  const ranges = { chooseExercise: 'exercises', answer: 'options', chooseRequest: 'requestTypes', switchRole: 'roles', choosePeriod: 'periods' };
  function dom(node, page) {
    if (node == null) return document.createTextNode('');
    if (typeof node === 'string' || typeof node === 'number') return document.createTextNode(String(node));
    const type = (node.tag || '').replace(/^wx-/, '');
    const attrs = node.attr || {};
    let element;
    if (type === 'picker') {
      element = document.createElement(attrs.mode === 'time' ? 'input' : 'select');
      element.className = 'picker preview-picker';
      if (attrs.mode === 'time') { element.type = 'time'; element.value = attrs.value || '17:30'; }
      else {
        const values = page.data[ranges[attrs.bindchange]] || [];
        values.forEach((value, index) => { const option = document.createElement('option'); option.value = index; option.textContent = value; element.appendChild(option); });
        if (attrs.bindchange === 'switchRole') {
          const me = page.data.view && page.data.view.me;
          element.value = me ? page.data.roleIds.indexOf(me.id) : 0;
        } else element.value = attrs.value == null ? 0 : attrs.value;
      }
    } else if (type === 'input' || type === 'switch' || type === 'checkbox') {
      element = document.createElement('input');
      if (type === 'switch' || type === 'checkbox') { element.type = 'checkbox'; element.checked = attrs.checked === true; if (type === 'switch') element.setAttribute('role', 'switch'); }
      else { element.type = 'text'; if (attrs.type === 'number' || attrs.type === 'digit') element.inputMode = attrs.type === 'digit' ? 'decimal' : 'numeric'; }
      if (attrs.value != null) element.value = String(attrs.value);
    } else if (type === 'textarea') { element = document.createElement('textarea'); element.value = attrs.value || ''; }
    else if (type === 'image') { element = document.createElement('img'); element.src = /^wxfile:\/\/preview\//.test(attrs.src || '') ? readStorage('image:' + attrs.src) || '' : ''; element.alt = '营友主动分享的图片'; }
    else element = document.createElement(type === 'button' ? 'button' : type === 'label' ? 'label' : type === 'text' ? 'span' : 'div');
    for (const [key, value] of Object.entries(attrs)) {
      if (key === 'class') element.className += (element.className ? ' ' : '') + value;
      else if (key === 'style') element.setAttribute('style', String(value).replace(/(-?\d*\.?\d+)rpx/g, 'calc(var(--rpx) * $1)'));
      else if (key.startsWith('data-')) element.setAttribute(key, String(value));
      else if (key === 'disabled') element.disabled = value === true;

    }
    if (type === 'checkbox-group') element.dataset.checkboxGroup = 'true';
    if (attrs.bindtap) element.addEventListener('click', event => { event.stopPropagation(); invoke(page, attrs.bindtap, element); });
    if (attrs.bindinput) element.addEventListener('input', () => invoke(page, attrs.bindinput, element, element.value, true));
    if (attrs.bindchange) element.addEventListener('change', event => {
      if (type === 'checkbox-group') {
        event.stopPropagation();
        const values = Array.from(element.querySelectorAll('input[type=checkbox]:checked')).map(item => item.value);
        invoke(page, attrs.bindchange, element, values);
      } else {
        event.stopPropagation(); invoke(page, attrs.bindchange, element, type === 'switch' ? element.checked : element.value);
      }
    });
    if (!['picker', 'textarea', 'input', 'switch', 'checkbox', 'image'].includes(type)) (node.children || []).forEach(child => element.appendChild(dom(child, page)));
    return element;
  }
  function paint() {
    try {
      const page = frames[active]; if (!page) return;
      const scroll = screen.scrollTop;
      const tree = renderer('pages/' + active + '/index.wxml')(page.data);
      screen.replaceChildren(dom(tree, page)); screen.scrollTop = scroll;
      document.querySelectorAll('.tabs button').forEach(button => button.classList.toggle('active', button.dataset.page === active));
      document.getElementById('back').hidden = !stack.length;
      const primary = ['today', 'community', 'profile'].includes(active);
      document.querySelector('.tabs').hidden = !primary;
    } catch (error) { screen.textContent = '预览出错：' + error.message; console.error(error); }
  }
  document.getElementById('back').onclick = back;
  document.querySelectorAll('.tabs button').forEach(button => { button.onclick = () => navigate('/pages/' + button.dataset.page + '/index', true); });
  document.querySelectorAll('[data-role]').forEach(button => { button.onclick = async () => {
    app.service.switchActor(button.dataset.role); Object.keys(frames).forEach(key => { delete frames[key]; });

  }; });
